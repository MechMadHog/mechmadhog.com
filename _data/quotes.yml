# Favourite quotes for /quotes/
# Keep entries short enough to scan. Tags are useful for SEO, accessibility, and future filtering.
#
# Fields:
# - text: the quote itself
# - author: person credited with the quote, character, or speaker
# - source: film, book, TV show, album, speech, etc.
# - source_type: film | book | tv | music | game | person | other
# - tags: lower-case keywords/categories
# - note: optional personal context

- text: "If you're going to do something wrong, do it right."
  author: "Zoe Morgan"
  source: "Person of Interest"
  source_type: "tv"
  tags: [tv, competence, pragmatism, humour]
  note: "If something is worth doing at all, half-assing it makes no sense."

- text: "No matter how bad things look, they look better awake than asleep."
  author: "Jack Starks"
  source: "The Jacket"
  source_type: "film"
  tags: [film, reality, suffering, awareness]
  note: "I’d rather deal with reality directly than hide from it."

- text: "For certain you have to be lost to find the places that can’t be found. Else wise, everyone would know where it was."
  author: "Hector Barbossa"
  source: "Pirates of the Caribbean: At World's End"
  source_type: "film"
  tags: [film, journey, mystery, philosophy]
  note: "I like the idea that some things can only be found indirectly. Straight lines don't discover much."

- text: "Sometimes science is more art than science morty. A lot of people don't get that."
  author: "Rick Sanchez"
  source: "Rick and Morty"
  source_type: "tv"
  tags: [tv, science, experimentation, creativity]
  note: "Most real discovery is messy. Trial, error, intuition, pattern recognition... then people pretend it was obvious afterwards."

- text: "Your boos mean nothing to me. I've seen what makes you cheer."
  author: "Rick Sanchez"
  source: "Rick and Morty"
  source_type: "tv"
  tags: [tv, cynicism, society, independence]
  note: "Popularity has very little to do with quality. Crowds validate nonsense constantly."

- text: "Following's not really my style."
  author: "Tony Stark"
  source: "Iron Man"
  source_type: "film"
  tags: [film, independence, individuality, confidence]
  note: "Blind conformity has never made much sense to me."

- text: "None of you seem to understand... I’m not locked in here with you, you’re locked in here with me."
  author: "Rorschach"
  source: "Watchmen"
  source_type: "comic"
  tags: [comic, intimidation, defiance]
  note: "I like the complete reversal of power in this line. The fear changes direction instantly."

- text: "That is why you fail." 
  author: "Yoda" 
  source: "The Empire Strike Back" 
  source_type: "film" 
  tags: [film, discipline, failure, wisdom] 
  note: "Directlyt after Luke says that he doesn't believe it... Yoda delivers the truth; no cushioning, no motivational speech... Just the actual reason."

- text: "I'm almost always eventually right." 
  author: "Greg House" 
  source: "House M.D. - S2 E24 - No Reason" 
  source_type: "tv" 
  tags: [tv, identity, psychology, human-nature] 
  note: "Being socially accepted and being correct are very often completely separate things."

- text: "I sometimes envy the blissful ignorance of those less well-versed in their... shit."
  author: "Harry Hart"
  source: "Kingsman: The Secret Service"
  source_type: "film"
  tags: [film, intelligence, awareness, cynicism]
  note: "The more patterns you notice, the harder it becomes to ignore how broken things are."



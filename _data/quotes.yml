# Favourite quotes for /quotes/
# Keep entries short enough to scan. Tags are useful for SEO, accessibility, and future filtering.
#
# Fields:
# - text: the quote itself
# - author: person credited with the quote, character, or speaker
# - source: film, book, TV show, album, speech, etc.
# - source_type: film | book | tv | music | game | comic | person | other
# - tags: lower-case keywords/categories
# - note: optional personal context

- text: "If you're going to do something wrong, do it right."
  author: "Zoe Morgan"
  source: "Person of Interest"
  source_type: "tv"
  tags: [tv, competence, pragmatism, humour]
  note: "If something is worth doing at all, half-assing it makes no sense."

- text: "Your father lived by a philosophy... a principle really. He believed that if you could do good things for other people, you had a moral obligation to do those things. That's what's at stake here. Not choice. Responsibility."
  author: "Uncle Ben"
  source: "The Amazing Spider-Man"
  source_type: "film"
  tags: [film, responsibility, morality, superheroes]
  note: "I mostly like this because they went through an entire detour just to avoid saying the actual line. - With Great Power Comes Great Responsibility "

- text: "It's not that I'm lazy, it's that I just don't care."
  author: "Peter Gibbons"
  source: "Office Space"
  source_type: "film"
  tags: [film, work, cynicism, burnout]
  note: "A lot of modern work feels disconnected from anything meaningful."

- text: "Your boos mean nothing to me. I've seen what makes you cheer."
  author: "Rick Sanchez"
  source: "Rick and Morty"
  source_type: "tv"
  tags: [tv, cynicism, society, independence]
  note: "Popularity has very little to do with quality. Crowds validate nonsense constantly."

- text: "No matter how bad things look, they look better awake than asleep."
  author: "Jack Starks"
  source: "The Jacket"
  source_type: "film"
  tags: [film, reality, suffering, awareness]
  note: "I’d rather deal with reality directly than hide from it."

- text: "For certain you have to be lost to find the places that can’t be found. Else wise, everyone would know where it was."
  author: "Hector Barbossa"
  source: "Pirates of the Caribbean: At World's End"
  source_type: "film"
  tags: [film, journey, mystery, philosophy]
  note: "I like the idea that some things can only be found indirectly. Straight lines don't discover much."

- text: "Sometimes science is more art than science morty. A lot of people don't get that."
  author: "Rick Sanchez"
  source: "Rick and Morty"
  source_type: "tv"
  tags: [tv, science, experimentation, creativity]
  note: "Most real discovery is messy. Trial, error, intuition, pattern recognition... then people pretend it was obvious afterwards."

- text: "Following's not really my style."
  author: "Tony Stark"
  source: "Iron Man"
  source_type: "film"
  tags: [film, independence, individuality, confidence]
  note: "Blind conformity has never made much sense to me."

- text: "None of you seem to understand... I’m not locked in here with you, you’re locked in here with me."
  author: "Rorschach"
  source: "Watchmen"
  source_type: "comic"
  tags: [comic, intimidation, defiance]
  note: "I like the complete reversal of power in this line. The fear changes direction instantly."

- text: "That is why you fail." 
  author: "Yoda" 
  source: "The Empire Strike Back" 
  source_type: "film" 
  tags: [film, discipline, failure, wisdom] 
  note: "Directlyt after Luke says that he doesn't believe it... Yoda delivers the truth; no cushioning, no motivational speech... Just the actual reason."

- text: "Sometimes the best gift, is never seeing you again" 
  author: "Greg House" 
  source: "House M.D." 
  source_type: "tv" 
  tags: [tv, identity, psychology, human-nature] 
  note: "Most of the time I just don't have the time or energy for other people's nonsense."

- text: "I sometimes envy the blissful ignorance of those less well-versed in their... shit."
  author: "Harry Hart"
  source: "Kingsman: The Secret Service"
  source_type: "film"
  tags: [film, intelligence, awareness, cynicism]
  note: "The more patterns you notice, the harder it becomes to ignore how broken things are."

- text: "When you do things right, people won't be sure you've done anything at all."
  author: "God Entity"
  source: "Futurama"
  source_type: "tv"
  tags: [tv, systems, subtlety, competence]
  note: "The best systems usually operate quietly in the background."

- text: "Eh. I don't need a Robin."
  author: "Evil Morty"
  source: "Rick and Morty"
  source_type: "tv"
  tags: [tv, independence, detachment, intelligence]
  note: "This was in response to Rick saying they could be like Batman and Robin. A lot of the time the people who want to be incharge. They just want the status, all while not being all that capable of their position."

- text: "It's funny. When you look at someone through rose-colored glasses, all the red flags just look like flags."
  author: "Wanda Pierce"
  source: "BoJack Horseman"
  source_type: "tv"
  tags: [tv, psychology, relationships, perception]
  note: "People often ignore reality to protect the version they want to believe."

- text: "A person is smart. People are dumb, panicky dangerous animals and you know it."
  author: "Agent K"
  source: "Men in Black"
  source_type: "film"
  tags: [film, society, psychology, crowds]
  note: "Individuals can think clearly. Crowds usually can't."

- text: "You know, it’s funny... when you look at the world rationally, the world looks rational back."
  author: "Dr. Manhattan"
  source: "Watchmen"
  source_type: "film"
  tags: [film, logic, perspective, philosophy]
  note: "The way you frame reality changes what you notice in it."

- text: "I don't want to live in a world where someone else makes the world a better place better than we do."
  author: "Gavin Belson"
  source: "Silicon Valley"
  source_type: "tv"
  tags: [tv, ego, tech, competition]
  note: "A perfect example of ego disguising itself as idealism."

- text: "I don't hate people. I just feel better when they're not around."
  author: "Sam Loudermilk"
  source: "Loudermilk"
  source_type: "tv"
  tags: [tv, isolation, cynicism, personality]
  note: "Most of the time solitude is just quieter and simpler."

- text: "No, Venti is Twenty. Large is Large, in fact Tall is Large and Grande is spannish for Large. Venti is the only one that doesn't mean Large, it's also the only one that's Italian... Congratulations, you’re stupid in three languages."
  author: "Danny Donahue"
  source: "Role Models"
  source_type: "film"
  tags: [film, sarcasm, humour, cynicism]
  note: "Dry sarcasm always lands better than loud comedy."

- text: "A woman who can be bought isn't worth having."
  author: "Wilson Fisk"
  source: "Daredevil"
  source_type: "tv"
  tags: [tv, relationships, values, power]
  note: "Transactional loyalty usually collapses the moment a better offer appears."

- text: "I'd rather have a bottle in front of me than a frontal lobotomy."
  author: "Tom Waits"
  source: "Quote"
  source_type: "other"
  tags: [other, wordplay, humour, cynicism]
  note: "Stupidly clever wordplay always sticks in my head."

- text: "Nobody panics when things go according to plan. Even if the plan is horrifying."
  author: "The Joker"
  source: "The Dark Knight"
  source_type: "film"
  tags: [film, society, psychology, systems]
  note: "People normalize dysfunction surprisingly quickly."

- text: "If you're good at something, never do it for free."
  author: "The Joker"
  source: "The Dark Knight"
  source_type: "film"
  tags: [film, value, competence, pragmatism]
  note: "Competence has value whether people like admitting it or not."

- text: "Oooh, ahhh, that's how it always starts. Then later there's running and screaming."
  author: "Dr. Ian Malcolm"
  source: "Jurassic Park"
  source_type: "film"
  tags: [film, sarcasm, chaos, foresight]
  note: "Most bad ideas look impressive right before they collapse."

- text: "A woman who can be bought isn't worth having."
  author: "Wilson Fisk"
  source: "Daredevil"
  source_type: "tv"
  tags: [tv, relationships, values, power]
  note: "Transactional loyalty usually collapses the moment a better offer appears."

- text: "Yeah, yeah, but your scientists were so preoccupied with whether or not they could, they didn't stop to think if they should."
  author: "Dr. Ian Malcolm"
  source: "Jurassic Park"
  source_type: "film"
  tags: [film, science, ethics, systems]
  note: "Intelligence without restraint creates a lot of modern problems."

- text: "We buy things we don't need with money we don't have to impress people we don't like."
  author: "Tyler Durden"
  source: "Fight Club"
  source_type: "film"
  tags: [film, consumerism, society, cynicism]
  note: "Still one of the cleanest summaries of modern culture."

- text: "Men don't follow titles. They follow courage."
  author: "William Wallace"
  source: "Braveheart"
  source_type: "film"
  tags: [film, leadership, courage, respect]
  note: "People respect conviction more than status."

- text: "The Almighty tells me he can get me out of this mess, but he's pretty sure you're fucked."
  author: "Stephen"
  source: "Braveheart"
  source_type: "film"
  tags: [film, humour, chaos, fatalism]
  note: "Completely ridiculous delivery... which is why it works."

- text: "Bio-digital jazz, man."
  author: "Kevin Flynn"
  source: "TRON"
  source_type: "film"
  tags: [film, technology, chaos, humour]
  note: "I like when technology is framed as something experimental and weird instead of sterile."

- text: "Now that's a big door."
  author: "Kevin Flynn"
  source: "TRON: Legacy"
  source_type: "film"
  tags: [film, humour, awe, technology]
  note: "Dry understatement always lands better than forced reactions. Feels like a joke about overcompensation."

- text: "The concept of waiting bewilders me. There are always deadlines. There are always ticking clocks."
  author: "Mr. Robot"
  source: "Mr. Robot"
  source_type: "tv"
  tags: [tv, time, urgency, systems]
  note: "Most people waste huge portions of their life waiting to feel ready."

- text: "This whole time I thought changing the world was something you did... an act you performed, something you fought for. I don't know if that's true anymore."
  author: "Mr. Robot"
  source: "Mr. Robot"
  source_type: "tv"
  tags: [tv, systems, change, identity]
  note: "Changing systems is usually messier and less heroic than people imagine."

- text: "People who get violent... they usually have something to hide."
  author: "Mr. Robot"
  source: "Mr. Robot"
  source_type: "tv"
  tags: [tv, psychology, violence, truth]
  note: "Aggression is often insecurity wearing armour."

- text: "Everybody knows the dice are loaded."
  author: "Mark Hunter"
  source: "Pump Up the Volume"
  source_type: "film"
  tags: [film, society, systems, cynicism]
  note: "A lot of systems are biased long before people enter them."

- text: "So be it."
  author: "Mark Hunter"
  source: "Pump Up the Volume"
  source_type: "film"
  tags: [film, acceptance, defiance, resolve]
  note: "Sometimes the only real option is accepting the consequences and moving forward anyway."

- text: "You are technically correct. The best kind of correct."
  author: "Bureaucrat #1"
  source: "Futurama"
  source_type: "tv"
  tags: [tv, logic, bureaucracy, humour]
  note: "One of the funniest observations about systems and rules."

- text: "I choose to believe what I was programmed to believe."
  author: "Bender"
  source: "Futurama"
  source_type: "tv"
  tags: [tv, determinism, humour, identity]
  note: "Funny because humans do the exact same thing."

- text: "I've done everything the Bible says... even the stuff that contradicts the other stuff!"
  author: "Ned Flanders"
  source: "The Simpsons"
  source_type: "tv"
  tags: [tv, religion, contradiction, humour]
  note: "Quietly savage writing."

- text: "I don't mind if you pee in the shower, but only if you're taking a shower."
  author: "Marge Simpson"
  source: "The Simpsons"
  source_type: "tv"
  tags: [tv, domesticity, absurdity, humour]
  note: "Very grounded Simpsons energy."

- text: "Worst day of your life so far."
  author: "Homer Simpson"
  source: "The Simpsons"
  source_type: "tv"
  tags: [tv, pessimism, humour, perspective]
  note: "One of the most unexpectedly philosophical Simpsons lines."

- text: "Oh, everything looks bad if you remember it."
  author: "Homer Simpson"
  source: "The Simpsons"
  source_type: "tv"
  tags: [tv, memory, denial, humour]
  note: "Disturbingly applicable to politics."

- text: "You know, a town with money is a little like the mule with a spinning wheel. Nobody knows how he got it, and danged if he knows how to use it."
  author: "Lyle Lanley"
  source: "The Simpsons"
  source_type: "tv"
  tags: [tv, corruption, society, manipulation]
  note: "Monorail is one of the sharpest satire episodes they ever made."

- text: "Am I so out of touch? No. It's the children who are wrong."
  author: "Principal Skinner"
  source: "The Simpsons"
  source_type: "tv"
  tags: [tv, denial, ego, generational]
  note: "Became a meme for a reason."

- text: "You'll have to speak up, I'm wearing a towel."
  author: "Homer Simpson"
  source: "The Simpsons"
  source_type: "tv"
  tags: [tv, absurdity, stupidity, humour]
  note: "Pure nonsensical Simpsons dialogue, well it's completely used out of context."

- text: "Alcohol... the cause of, and solution to, all of life's problems."
  author: "Homer Simpson"
  source: "The Simpsons"
  source_type: "tv"
  tags: [tv, addiction, irony, humour]
  note: "Probably the most quoted Homer line ever."

- text: "A noble spirit embiggens the smallest man."
  author: "Jebediah Springfield"
  source: "The Simpsons"
  source_type: "tv"
  tags: [tv, wisdom, language, character, legacy]
  note: "Followed by the immortal cromulent exchange."

- text: "I don't know why? It's a perfectly cromulent word."
  author: "Miss Hoover"
  source: "The Simpsons"
  source_type: "tv"
  tags: [tv, language, absurdity, humour]
  note: "One of the greatest fake-word jokes ever created."

- text: "Just because I don't care doesn't mean I don't understand."
  author: "Homer Simpson"
  source: "The Simpsons"
  source_type: "tv"
  tags: [tv, apathy, intelligence, humour]
  note: "Accidentally insightful."

- text: "We can't bust heads like we used to, but we have our ways. One trick is to tell them stories that don't go anywhere... like the time I caught the ferry over to Shelbyville."
  author: "Abe Simpson"
  source: "The Simpsons"
  source_type: "tv"
  tags: [tv, aging, storytelling, absurdity]
  note: "Peak rambling old-man energy."

- text: "You can't keep the democrats out of the White House forever. And when they get in, I'm back on the streets... with all my criminal buddies."
  author: "Sideshow Bob"
  source: "The Simpsons"
  source_type: "tv"
  tags: [tv, politics, satire, cynicism]
  note: "Ridiculous bipartisan slander. Very Simpsons."

- text: "The problem with trying to be the bad guy... is that there’s always someone worse."
  author: "John Reese"
  source: "Person of Interest"
  source_type: "tv"
  tags: [tv, morality, power, violence]
  note: "No matter how ruthless someone thinks they are, there’s usually a deeper level below them."

- text: "FBI and the army before that, they helped keep me on the straight and narrow path. But now... without that it's all... I'm drowning in deep water and I don't know whether I'm swimming through the surface or the bottom."
  author: "Benjamin Poindexter"
  source: "Daredevil"
  source_type: "tv"
  tags: [tv, psychology, identity, instability]
  note: "Good description of losing all sense of orientation mentally while still trying to function."

- text: "Feelings are overrated."
  author: "Sameen Shaw"
  source: "Person of Interest"
  source_type: "tv"
  tags: [tv, emotion, psychology, detachment]
  note: "Emotion without control tends to distort decision-making."

- text: "I’m good at what I do. That’s all."
  author: "Sameen Shaw"
  source: "Person of Interest"
  source_type: "tv"
  tags: [tv, competence, identity, pragmatism]
  note: "Competence matters more than performance."

- text: "I was built for this."
  author: "Sameen Shaw"
  source: "Person of Interest"
  source_type: "tv"
  tags: [tv, competence, purpose, identity]
  note: "Some people function better in chaos than normality."

- text: "No one ever listens to me. I talk and talk and no one listens."
  author: "Marvin"
  source: "The Hitchhiker's Guide to the Galaxy"
  source_type: "book"
  tags: [book, isolation, cynicism, humour]
  note: "Dry pessimism becomes weirdly relatable after enough repetition."

- text: "Choice is an illusion created between those with power and those without."
  author: "Merovingian"
  source: "The Matrix Reloaded"
  source_type: "film"
  tags: [film, power, systems, control]
  note: "A lot of freedom exists inside invisible constraints."

- text: "The price of certainty is the loss of curiosity."
  author: "Richard Feynman"
  source: "Quote"
  source_type: "other"
  tags: [other, intelligence, curiosity, philosophy]
  note: "People stop learning the moment they become emotionally attached to certainty."

- text: "You know what's cooler than magic? Mathematics."
  author: "Derek Knows"
  source: "The Lost Room"
  source_type: "tv"
  tags: [tv, intelligence, systems, logic]
  note: "Patterns and systems are more interesting than spectacle."

- text: "The enemy of a good plan is the dream of a perfect plan."
  author: "Carl von Clausewitz"
  source: "Quote"
  source_type: "other"
  tags: [other, planning, pragmatism, systems]
  note: "Perfectionism wastes more time than imperfection."

- text: "You can never know everything, but you can know enough."
  author: "Isaac Asimov"
  source: "Quote"
  source_type: "other"
  tags: [other, knowledge, intelligence, realism]
  note: "Useful understanding matters more than total understanding."

- text: "The more complicated the order, the easier it is to manipulate."
  author: "Grand Admiral Thrawn"
  source: "Star Wars Rebels"
  source_type: "tv"
  tags: [tv, strategy, systems, intelligence]
  note: "Complex systems create blind spots."

- text: "That's a good question. I haven't known the answer for a long time. I know who I was. I was the guy who left her behind. You know why? Because I thought she deserved someone better than me. I thought she deserved someone who would look after her, be there for her. I thought she deserved someone like you."
  author: "John Reese"
  source: "Person of Interest"
  source_type: "tv"
  tags: [tv, regret, identity, relationships]
  note: "One of the few moments Reese fully drops the armour and admits how low his opinion of himself really is."

- text: "Who am I supposed to be now? Now that she's gone. When you find that one person who connects you to the world, you become someone different... someone better. When that person is taken from you, what do you become then?"
  author: "John Reese"
  source: "Person of Interest"
  source_type: "tv"
  tags: [tv, loss, identity, connection]
  note: "Good description of how certain people become part of your orientation system... and how disorientating it is when they're gone."
 
- text: "Reality is that which, when you stop believing in it, doesn't go away."
  author: "Philip K. Dick"
  source: "Quote"
  source_type: "other"
  tags: [other, reality, truth, philosophy]
  note: "Reality does not care about preference."

- text: "Hell is other people."
  author: "Jean-Paul Sartre"
  source: "No Exit"
  source_type: "book"
  tags: [book, society, psychology, isolation]
  note: "Other people complicate almost everything."

- text: "No snowflake in an avalanche ever feels responsible."
  author: "Voltaire"
  source: "Quote"
  source_type: "other"
  tags: [other, society, responsibility, systems]
  note: "Collective stupidity spreads accountability thin."

- text: "The only way to deal with an unfree world is to become so absolutely free that your very existence is an act of rebellion."
  author: "Albert Camus"
  source: "Quote"
  source_type: "other"
  tags: [other, freedom, rebellion, identity]
  note: "Authenticity itself can become resistance."

- text: "Real loss is only possible when you love something more than you love yourself."
  author: "Sean Maguire"
  source: "Good Will Hunting"
  source_type: "film"
  tags: [film, love, loss, psychology]
  note: "Attachment creates vulnerability whether people admit it or not."

- text: "Closure is a made-up thing by Steven Spielberg to sell movie tickets."
  author: "Bojack Horseman"
  source: "BoJack Horseman"
  source_type: "tv"
  tags: [tv, realism, psychology, life]
  note: "Most things end messily rather than cleanly."

- text: "You know how they say it's been a pleasure? It hasn't."
  author: "Russell Edgington"
  source: "True Blood"
  source_type: "tv"
  tags: [tv, sarcasm, humour, hostility]
  note: "Dry hostility is usually funnier than fake politeness."

- text: "You know, this is why I don't like talking to people. They always want something."
  author: "Sameen Shaw"
  source: "Person of Interest"
  source_type: "tv"
  tags: [tv, isolation, sarcasm, psychology]
  note: "A lot of social interaction feels transactional."

- text: "You'd be surprised what people tell you when they think you're dead."
  author: "Patrick Jane"
  source: "The Mentalist"
  source_type: "tv"
  tags: [tv, psychology, observation, manipulation]
  note: "People reveal themselves once consequences disappear."

- text: "The danger in believing things is that you stop thinking."
  author: "Cal Lightman"
  source: "Lie to Me"
  source_type: "tv"
  tags: [tv, psychology, truth, skepticism]
  note: "Certainty tends to shut curiosity off."

- text: "Nothing's ever anybody's fault."
  author: "Daria Morgendorffer"
  source: "Daria"
  source_type: "tv"
  tags: [tv, society, sarcasm, responsibility]
  note: "Modern culture is very good at diffusing accountability."

- text: "I don't break the rules... I bend them a little."
  author: "Neal Caffrey"
  source: "White Collar"
  source_type: "tv"
  tags: [tv, intelligence, systems, pragmatism]
  note: "Most systems require flexibility to function properly."

- text: "You know what I like about being dead? The freedom."
  author: "Root"
  source: "Person of Interest"
  source_type: "tv"
  tags: [tv, freedom, identity, detachment]
  note: "POI constantly blurred the line between freedom and isolation."

- text: "I learned everyone is alone. But if someone can make you feel less alone... maybe that's enough."
  author: "Root"
  source: "Person of Interest"
  source_type: "tv"
  tags: [tv, loneliness, connection, meaning]
  note: "Connection matters more when isolation feels like the default state."

- text: "People choose the paths that grant them the greatest rewards for the least amount of effort."
  author: "Greg House"
  source: "House M.D."
  source_type: "tv"
  tags: [tv, psychology, human-nature, realism]
  note: "Most behaviour becomes predictable once incentives are visible."

- text: "I think that if you do something wrong long enough, you forget what right is supposed to look like."
  author: "Dexter Morgan"
  source: "Dexter"
  source_type: "tv"
  tags: [tv, morality, psychology, identity]
  note: "Repeated behaviour eventually rewires normality."

- text: "The problem with humanity is that we value sentiment over survival."
  author: "Sylar"
  source: "Heroes"
  source_type: "tv"
  tags: [tv, survival, psychology, cynicism]
  note: "Cold logic often clashes with emotional morality."

- text: "You can never know anyone completely. That's a good thing."
  author: "Patrick Jane"
  source: "The Mentalist"
  source_type: "tv"
  tags: [tv, psychology, mystery, identity]
  note: "People are more layered than the roles they perform."

- text: "People don't really change. They just find something to hide behind."
  author: "Cal Lightman"
  source: "Lie to Me"
  source_type: "tv"
  tags: [tv, identity, deception, psychology]
  note: "A lot of personality is just managed presentation."

- text: "Sometimes the only way to stay sane is to go a little crazy."
  author: "Daria Morgendorffer"
  source: "Daria"
  source_type: "tv"
  tags: [tv, sanity, society, sarcasm]
  note: "Trying to function in broken systems eventually affects people."

- text: "The truth is hard. The truth is ugly. But the truth is still the truth."
  author: "Cal Lightman"
  source: "Lie to Me"
  source_type: "tv"
  tags: [tv, truth, psychology, realism]
  note: "Reality doesn't become false just because it's uncomfortable."

- text: "Most people don't really want the truth. They want reassurance."
  author: "Patrick Jane"
  source: "The Mentalist"
  source_type: "tv"
  tags: [tv, truth, psychology, society]
  note: "People often prefer comfort over accuracy."

- text: "You can’t build a good system on top of a broken foundation."
  author: "Harold Finch"
  source: "Person of Interest"
  source_type: "tv"
  tags: [tv, systems, logic, structure]
  note: "Most large problems start much lower down than people admit."

- text: "Most people live their whole lives inside a story someone else wrote for them."
  author: "Mark Hunter"
  source: "Pump Up the Volume"
  source_type: "film"
  tags: [film, identity, conformity, society]
  note: "A lot of people inherit their worldview instead of building one."

- text: "It's amazing what people can justify when they're afraid."
  author: "Root"
  source: "Person of Interest"
  source_type: "tv"
  tags: [tv, fear, morality, society]
  note: "Fear changes moral boundaries very quickly."

- text: "Everybody wants to be understood. Nobody wants to be analyzed."
  author: "Cal Lightman"
  source: "Lie to Me"
  source_type: "tv"
  tags: [tv, psychology, identity, observation]
  note: "People like insight right up until it becomes accurate."


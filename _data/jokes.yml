# Favourite jokes for /jokes/
# Keep entries short enough to scan. Tags are useful for SEO, accessibility, and future filtering.
#
# Fields:
# - text: the joke itself
# - author: comedian credited with the joke,
# - source: stand up, roast, etc.
# - source_type: stand-up | roast | other
# - tags: lower-case keywords/categories
# - note: optional personal context

- text: "I don't want to drudge up any old wounds... But your father famously abandoned you, so that he could start a new life with the legendary Elizabeth Taylor. But can you blame him? There isn't a man in his right mind who could possibly resist walking out on you."
  comedian: "Anthony Jeselnik"
  source: "Comedy Central Roast of Roseanne"
  source_type: "roast"
  tags:
    - dark humour
    - roast
    - misdirection
  note: "He is so good at saying the thing you'd least expect from his build-up."

- text: "In his book he said that he would have taken a bullet or stood in front of a train for Nicole... Man I'm gonna tell you that is some bad luck; when the one guy who would have died for you... Kills you, you don't get worse luck than that."
  comedian: "Norm MacDonald"
  source: "Norm MacDonald on OJ Simpson"
  source_type: "SNL - Weekend Update"
  tags:
  - dark humour
  - literalism
  - absurd logic
  - deadpan
  note: "Norm takes a figure of speech completely literally and follows the logic to an absurd conclusion. I love how he deliberately focuses on the least important part of the story."

- text: "I adore a two-star experience... It is that kind of integrity of mediocrity over time that deserves celebration. The energy that it takes to not improve."
  comedian: "Maria Bamford"
  source: "Stand-up"
  source_type: "stand-up"
  tags:
    - observational
    - perspective shift
    - absurd logic
    - commitment
  note: "She completely inverts the audience's expectations by celebrating mediocrity instead of excellence. Rather than complaining about a bad shop, she admires its unwavering commitment to being average, and never breaks from that perspective."

- text: "I feel that one of the basic requirements of being a sprinter is having legs."
  comedian: "Norm Macdonald"
  source: "Conan - Oscar Pistorius"
  source_type: "interview"
  tags:
    - deadpan
    - literalism
    - heartless bastard
    - commitment
    - absurd logic
  note: "Norm takes the idea completely literally and refuses to leave that position. He ignores the debate everyone else is having and instead argues that having legs should simply be a requirement for running. The funnier Conan and Andy find his argument, the more seriously he defends it."

- text: "Jeffrey Epstein... no one criticizes him? Jeff Epstein... the New York financier?"
  comedian: "Jim Downey"
  source: "Conan - Jeff Epstein"
  source_type: "interview"
  tags:
    - deadpan
    - commitment
    - feigned ignorance
    - absurd logic
    - character
  note: "Jim pretends to only know Jeffrey Epstein only as a respectable financier and refuses to acknowledge anything else. The joke comes from committing completely to obvious, deliberate ignorance and forcing everyone else to explain something that shouldn't need explaining."

- text: "I wanted to talk to you, Conan, about something that's very important to me... Camouflage."
  comedian: "Tom Green"
  source: "Late Night with Conan O'Brien"
  source_type: "interview"
  tags:
    - deadpan
    - commitment
    - absurdity
    - anti-humour
    - character
  note: "Tom arrives dressed head-to-toe in camouflage to blend in with the furniture, then treats camouflage as though it's a deeply important subject. He never acknowledges how ridiculous the situation is."

- text: "Of course... but maybe."
  comedian: "Louis C.K."
  source: "Oh My God"
  source_type: "stand-up"
  tags:
    - perspective shift
    - observational
    - absurd logic
    - commitment
  note: "He starts with an obvious truth, then immediately explores the uncomfortable thought everyone else suppresses. The humour comes from following that forbidden line of reasoning rather than pretending it doesn't exist."

- text: "I hope the person she loved most pushed her off a cliff... and then Superman swooped her up... and then dropped her from higher."
  comedian: "Louis C.K."
  source: "Hilarious"
  source_type: "stand-up"
  tags:
    - escalation
    - heartless bastard
    - deadpan
    - absurdity
    - commitment
  note: "The escalation is what makes this brilliant. Louis could stop at wishing she'd fall off a cliff, but instead keeps making the situation increasingly ridiculous. Superman's only purpose in the story is to save her... and Louis immediately has him make it even worse. The joke never lets the audience recover before taking it one step further."
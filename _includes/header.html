<header id="navbar">
  <nav class="nav-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/images/logo.png' | relative_url }}" alt="Site logo">
    </a>

    <!-- Desktop nav (your styling) -->
    <ul class="nav-links hidden md:flex">
      <li><a href="{{ '/' | relative_url }}">Home</a></li>
      <li><a href="{{ '/about/' | relative_url }}">About</a></li>
      <li><a href="{{ '/art/' | relative_url }}">Art</a></li>
      <li><a href="{{ '/now/' | relative_url }}">Now</a></li>
      <li><a href="{{ '/journal/' | relative_url }}">Journal</a></li>
      <li><a href="{{ '/contact/' | relative_url }}">Contact</a></li>
      <li>
        <a
          class="nav-cta"
          href="https://michaelmacdonagh.net"
          target="_blank"
          rel="noopener"
        >Portfolio ⇨</a>
      </li>
    </ul>
    <button
      class="nav-toggle"
      type="button"
      aria-controls="mobileNav"
      aria-expanded="false"
      aria-label="Open menu"
    >
      <i class="fa-solid fa-bars"></i>
    </button>
  </nav>

  <!-- Mobile menu (Tailwind controls hidden) -->
  <div
    id="mobileNav"
    class="hidden md:hidden border-t"
    style="border-color: var(--border-soft); background: rgba(11,11,19,0.95); backdrop-filter: blur(8px); box-shadow: var(--glow);"
  >
    <ul class="nav-links flex flex-col items-start px-4 py-3 gap-3">
      <li><a href="{{ '/' | relative_url }}">Home</a></li>
      <li><a href="{{ '/about/' | relative_url }}">About</a></li>
      <li><a href="{{ '/art/' | relative_url }}">Art</a></li>
      <li><a href="{{ '/now/' | relative_url }}">Now</a></li>
      <li><a href="{{ '/journal/' | relative_url }}">Journal</a></li>
      <li><a href="{{ '/contact/' | relative_url }}">Contact</a></li>
      <li>
        <a
          class="nav-cta"
          href="https://michaelmacdonagh.net"
          target="_blank"
          rel="noopener"
        >Portfolio ⇨</a>
      </li>
    </ul>
  </div>

  <script>
    (function () {
      const btn = document.querySelector(".nav-toggle");
      const panel = document.getElementById("mobileNav");
      if (!btn || !panel) return;

      const icon = btn.querySelector("i");

      function setOpen(open) {
        btn.setAttribute("aria-expanded", String(open));
        panel.hidden = !open;

        if (icon) {
          icon.classList.toggle("fa-bars", !open);
          icon.classList.toggle("fa-xmark", open);
        }
      }

      btn.addEventListener("click", function () {
        const isOpen = btn.getAttribute("aria-expanded") === "true";
        setOpen(!isOpen);
      });

      // Close when a link is clicked
      panel.addEventListener("click", function (e) {
        const link = e.target.closest("a");
        if (!link) return;
        setOpen(false);
      });

      // Close when clicking outside
      document.addEventListener("click", function (e) {
        const clickedInside = e.target.closest("#navbar");
        const isOpen = btn.getAttribute("aria-expanded") === "true";
        if (!clickedInside && isOpen) setOpen(false);
      });
    })();
  </script>

</header>

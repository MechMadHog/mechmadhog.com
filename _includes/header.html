    <!-- Desktop nav -->
    <ul class="nav-links nav-links--desktop">
    <li>
      <a href="{{ '/' | relative_url }}">Home</a>
    </li>
    <li class="mega-menu">
      <button class="mega-trigger">About</button>
      <div class="mega-panel">
        <div class="mega-column">
          <a href="{{ '/about/' | relative_url }}">About Me</a>
          <a href="{{ '/atm/' | relative_url }}">ATM</a>
        </div>
      </div>
    </li>
    <li class="mega-menu">
      <button class="mega-trigger">Hobbies</button>
      <div class="mega-panel">
        <div class="mega-column">
          <a href="{{ '/art/' | relative_url }}">Art</a>
          <a href="{{ '/music/' | relative_url }}">Music</a>
          <a href="{{ '/comedy/' | relative_url }}">Comedy</a>
          <a href="{{ '/movies-tv/' | relative_url }}">Movies & TV</a>
          <a href="{{ '/dnd/' | relative_url }}">D&amp;D</a>
        </div>
      </div>
    </li>
    <li class="mega-menu">
      <button class="mega-trigger">Writing</button>
      <div class="mega-panel">
        <div class="mega-column">
          <a href="{{ '/journal/' | relative_url }}">Blog</a>
          <a href="{{ '/quotes/' | relative_url }}">Quotes</a>
        </div>
      </div>
    </li>
    <li>
      <a href="{{ '/contact/' | relative_url }}">Contact</a>
    </li>
      <li>
        <a
          class="nav-cta"
          href="https://michaelmacdonagh.net"
          target="_blank"
          rel="noopener"
        >Portfolio ⇨</a>
      </li>
    </ul>
    <button 
      id="navToggle" 
      class="nav-toggle"
      type="button"
      aria-controls="mobileNav"
      aria-expanded="false"
      aria-label="Open menu"
    >
      <i class="fa-solid fa-bars"></i>
    </button>
  </nav>

  <!-- Mobile menu (Tailwind controls hidden) -->
  <div
    id="mobileNav"
    class="border-t" hidden
    style="border-color: var(--border-soft); background: rgba(11,11,19,0.95); backdrop-filter: blur(8px); box-shadow: var(--glow);"
  >
    <ul class="nav-links flex flex-col items-start px-4 py-3 gap-3">
      <li><a href="{{ '/' | relative_url }}">Home</a></li>
      <li><a href="{{ '/about/' | relative_url }}">About</a></li>
      <li><a href="{{ '/art/' | relative_url }}">Art</a></li>
      <li><a href="{{ '/now/' | relative_url }}">Now</a></li>
      <li><a href="{{ '/journal/' | relative_url }}">Journal</a></li>
      <li><a href="{{ '/contact/' | relative_url }}">Contact</a></li>
      <li>
        <a
          class="nav-cta"
          href="https://michaelmacdonagh.net"
          target="_blank"
          rel="noopener"
        >Portfolio ⇨</a>
      </li>
    </ul>
  </div>

 <script>
  (function () {
    const btn = document.getElementById("navToggle");
    const panel = document.getElementById("mobileNav");

    // If either element is missing, do nothing.
    if (!btn || !panel) return;

    const icon = btn.querySelector("i");

    function setOpen(open) {
      btn.setAttribute("aria-expanded", String(open));
      panel.hidden = !open;

      // Icon swap is optional (only if the <i> exists)
      if (icon) {
        icon.classList.remove(open ? "fa-bars" : "fa-xmark");
        icon.classList.add(open ? "fa-xmark" : "fa-bars");
      }
    }

    // Ensure a known starting state
    setOpen(false);

    btn.addEventListener("click", function (e) {
      e.preventDefault();
      const isOpen = btn.getAttribute("aria-expanded") === "true";
      setOpen(!isOpen);
    });

    // Close after clicking any link inside the mobile menu
    panel.addEventListener("click", function (e) {
      if (e.target.closest("a")) setOpen(false);
    });

    // Close when resizing up to desktop (prevents odd states)
    window.addEventListener("resize", function () {
      // match your CSS breakpoint; change 760 if your breakpoint differs
      if (window.innerWidth > 760) setOpen(false);
    });
  })();
</script>


</header>
